<!doctype html>
<html lang="en">
  <head>
    <script>window.location.replace('/app.html?view=chat');</script>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#f5f1e9" /><title>Brivia Club · Chat</title><script type="module">import './app.css';</script><style>.app-nav-button{text-decoration:none}.static-chat-placeholder{padding:30px 20px;border:1px solid var(--app-line);color:var(--app-muted);font-size:13px;line-height:1.5}.static-chat-list{border:1px solid var(--app-line)}.static-chat-row{display:flex;align-items:center;gap:14px;width:100%;padding:17px;border:0;border-bottom:1px solid var(--app-line);background:transparent;color:#291d1b;text-align:left;cursor:pointer}.static-chat-row:last-child{border-bottom:0}.static-chat-row:hover{background:rgba(116,31,57,.07)}.static-chat-row span{display:block}.static-chat-row span:last-child{margin-top:5px;color:var(--app-muted);font-size:11px}</style>
  </head>
  <body class="app-body"><div class="app-wrap">
    <header class="app-topbar"><a class="app-brand" href="/"><span class="app-brand-prefix">the</span><strong>Brivia Club</strong></a><a class="app-avatar-button" href="/profile.html" aria-label="Open profile">YU</a></header>
    <main class="app-main"><section class="app-view is-active"><div class="view-topline"><span>MESSAGES / PRIVATE</span><span>02 ACTIVE</span></div><div class="view-heading"><p class="app-eyebrow">YOUR CONNECTIONS</p><h1>Good things<br /><em>start small.</em></h1></div><div class="static-chat-list"><button class="static-chat-row" type="button" data-person="Priya"><div class="mini-avatar">P</div><div><strong>Priya</strong><span>Say hello and start something interesting.</span></div></button><button class="static-chat-row" type="button" data-person="Arjun"><div class="mini-avatar">A</div><div><strong>Arjun</strong><span>Your connection is waiting for a warm intro.</span></div></button></div><div id="static-chat-placeholder" class="static-chat-placeholder" hidden>Chat with <strong id="static-chat-person"></strong> will appear here. Send a pitch from the Home swipe card to start the conversation.</div></section></main>
    <nav class="app-bottom-nav" aria-label="Member navigation"><a class="app-nav-button" href="/app.html?view=home"><span>⌂</span>HOME</a><a class="app-nav-button" href="/explore.html"><span>◎</span>CONNECT</a><a class="app-nav-button" href="/app.html?view=posts"><span>✦</span>EXPLORE</a><a class="app-nav-button is-active" href="/chat.html"><span>◌</span>CHAT<i>2</i></a><a class="app-nav-button" href="/profile.html"><span>◉</span>PROFILE</a></nav>
  </div><script>document.querySelectorAll('[data-person]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#static-chat-person').textContent=button.dataset.person;document.querySelector('#static-chat-placeholder').hidden=false}))</script></body>
</html>
